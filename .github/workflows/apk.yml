# Gera o APK de teste do Android a cada push na main (ou à mão, em Actions > APK Android > Run workflow).
# O arquivo fica em Actions > (a execução) > Artifacts > honey-troop-apk.
name: APK Android
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # o runner do GitHub já vem com o Android SDK (ANDROID_HOME)
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: honey-troop-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
